<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mes tâches</title>
  <meta name="description" content="Une to-do list simple, installable et utilisable hors ligne.">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tâches">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <div>
        <h1>Mes tâches</h1>
        <p class="subtitle" id="summary"></p>
      </div>
      <button class="icon-btn" id="menu-btn" aria-label="Menu" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
      </button>
    </div>
    <div class="menu" id="menu" hidden>
      <button data-action="clear-done">Supprimer les tâches terminées</button>
      <button data-action="export">Exporter une sauvegarde</button>
      <button data-action="import">Importer une sauvegarde</button>
    </div>
    <input type="file" id="import-file" accept="application/json,.json" hidden>
    <nav class="filters" role="tablist">
      <button role="tab" data-filter="active" aria-selected="true">À faire</button>
      <button role="tab" data-filter="today" aria-selected="false">Aujourd'hui</button>
      <button role="tab" data-filter="done" aria-selected="false">Terminées</button>
      <button role="tab" data-filter="all" aria-selected="false">Toutes</button>
    </nav>
  </header>

  <main>
    <ul class="list" id="list"></ul>
    <div class="empty" id="empty" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>
      <p id="empty-text"></p>
    </div>
  </main>

  <form class="composer" id="composer" autocomplete="off">
    <div class="composer-extra" id="composer-extra" hidden>
      <label>Échéance <input type="date" id="new-due"></label>
      <label class="prio-toggle"><input type="checkbox" id="new-prio"> Prioritaire</label>
    </div>
    <div class="composer-row">
      <button type="button" class="icon-btn" id="extra-btn" aria-label="Options de la tâche" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      </button>
      <input type="text" id="new-title" placeholder="Ajouter une tâche…" enterkeyhint="done" maxlength="200" required>
      <button type="submit" class="add-btn" aria-label="Ajouter">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </form>

  <dialog id="edit-dialog">
    <form method="dialog" id="edit-form">
      <h2>Modifier la tâche</h2>
      <label>Titre <input type="text" id="edit-title" maxlength="200" required></label>
      <label>Notes <textarea id="edit-notes" rows="3"></textarea></label>
      <label>Échéance <input type="date" id="edit-due"></label>
      <label class="prio-toggle"><input type="checkbox" id="edit-prio"> Prioritaire</label>
      <div class="dialog-actions">
        <button type="button" class="danger" id="edit-delete">Supprimer</button>
        <span class="spacer"></span>
        <button type="button" id="edit-cancel">Annuler</button>
        <button type="submit" class="primary">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button id="toast-undo">Annuler</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
